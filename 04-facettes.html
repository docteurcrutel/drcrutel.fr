<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Dr. Crutel — N°4 Facettes</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; font-family: 'Caveat', cursive; overflow: hidden; }
  #root { position: absolute; inset: 0; }
  .nav-back { position: fixed; top: 16px; left: 16px; z-index: 100; font-family: 'Caveat', cursive; font-size: 22px; color: #f6efe2; text-decoration: none; background: rgba(20,20,20,0.7); padding: 6px 14px; border: 1px solid rgba(246,239,226,0.2); border-radius: 6px; }
</style>
<style id="embed-mode-style">
/* Embed mode: hide playback bar + nav, beige paper background, no letterbox */
html.embed-mode, html.embed-mode body { background: #f6efe2 !important; }
body.embed-mode .nav-back { display: none !important; }
/* Stage's flex container is #root > div */
body.embed-mode #root > div { background: #f6efe2 !important; }
/* Hide playback bar (2nd child) */
body.embed-mode #root > div > *:nth-child(2) { display: none !important; }
/* Remove canvas shadow */
body.embed-mode #root > div > div:first-child > div { box-shadow: none !important; }
</style>
<script>
(function() {
  if (new URLSearchParams(location.search).has('embed')) {
    document.documentElement.classList.add('embed-mode');
    if (document.body) document.body.classList.add('embed-mode');
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('embed-mode');
    });
  }
})();
</script>
</head>
<body data-anim-root data-screen-label="04 Facettes t=0s">
<a class="nav-back" href="index.html">← Carnet</a>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="sketch-components.jsx"></script>
<script type="text/babel">
const { useEffect } = React;

function FacetteAnim() {
  const time = useTime();
  useEffect(() => { document.body.setAttribute('data-screen-label', `04 Facettes t=${Math.floor(time)}s`); }, [Math.floor(time)]);

  return (
    <PaperBg>
      <PageHeader title="Les facettes dentaires" subtitle="sublimer la forme et la teinte" num={4} progress={1}/>

      {/* Scene 1: avant — dents irrégulières */}
      <Sprite start={0.5} end={4.5}>
        {({ progress }) => {
          const drawP = clamp(progress / 0.4, 0, 1);
          const washP = clamp((progress - 0.3) / 0.4, 0, 1);
          return (
            <>
              <svg width="1920" height="1080" style={{ position: 'absolute', inset: 0 }}>
                <SketchDefs/>
                <g transform="translate(960 600)">
                  {/* uneven teeth: different rotations and sizes */}
                  <ToothIncisor cx={-260} cy={5} scale={1.35} rotate={-3}
                                drawProgress={drawP} washProgress={washP} showGum={true}/>
                  <ToothIncisor cx={-130} cy={-8} scale={1.4}
                                drawProgress={Math.max(0, drawP - 0.05)} washProgress={washP} showGum={true}/>
                  <ToothIncisor cx={0} cy={10} scale={1.25} rotate={5}
                                drawProgress={Math.max(0, drawP - 0.1)} washProgress={washP} showGum={true}/>
                  <ToothIncisor cx={130} cy={0} scale={1.4}
                                drawProgress={Math.max(0, drawP - 0.15)} washProgress={washP} showGum={true}/>
                  <ToothIncisor cx={260} cy={5} scale={1.3} rotate={-2}
                                drawProgress={Math.max(0, drawP - 0.2)} washProgress={washP} showGum={true}/>
                </g>
                {/* annotation: small chip */}
                {washP > 0.5 && (
                  <g opacity={(washP - 0.5) * 2}>
                    <ArrowSketch from={{x: 1340, y: 500}} to={{x: 1100, y: 510}} curvature={20} progress={1}/>
                  </g>
                )}
              </svg>
              <HandwrittenLabel text="Dents abîmées, irrégulières…"
                x={140} y={400} size={40} progress={drawP} rotate={-1}/>
              <HandwrittenLabel text="ébréchures, espaces, teinte"
                x={140} y={460} size={26} progress={clamp((progress - 0.3) / 0.4, 0, 1)}
                color={SketchColors.pencilLight} rotate={-1}/>
            </>
          );
        }}
      </Sprite>

      {/* Scene 2: préparation très fine + facettes flottent */}
      <Sprite start={4.5} end={9.5}>
        {({ progress }) => {
          // Veneers descend from above
          const veneerY = interpolate([0.2, 0.7], [-300, 0], Easing.easeInOutCubic)(progress);
          const veneerP = clamp((progress - 0.15) / 0.1, 0, 1);
          const settleP = clamp((progress - 0.7) / 0.3, 0, 1);
          return (
            <>
              <svg width="1920" height="1080" style={{ position: 'absolute', inset: 0 }}>
                <SketchDefs/>
                {/* base teeth (slightly prepared = same tooth) */}
                <g transform="translate(960 600)" opacity="0.7">
                  {[-260, -130, 0, 130, 260].map((x, i) => (
                    <ToothIncisor key={i} cx={x} cy={i % 2 === 0 ? 5 : -5} scale={1.35}
                                  drawProgress={1} washProgress={1} showGum={true}/>
                  ))}
                </g>
                {/* descending veneers */}
                {veneerP > 0 && (
                  <g transform={`translate(0 ${veneerY})`} opacity={veneerP}>
                    {[-260, -130, 0, 130, 260].map((x, i) => (
                      <g key={i} transform={`translate(${960 + x} 600)`}>
                        <path d="M -38 -160 Q -45 -135 -42 -85 Q -40 -45 -32 -10 L 32 -10 Q 40 -45 42 -85 Q 45 -135 38 -160 Q 20 -168 0 -166 Q -20 -168 -38 -160 Z"
                              fill="rgba(255,253,248,0.92)"
                              stroke={SketchColors.pencilLight} strokeWidth="1" filter="url(#pencilRough)"/>
                        <path d="M -28 -148 Q -32 -120 -25 -90 Q -15 -75 -5 -82"
                              stroke="rgba(255,255,255,0.85)" strokeWidth="2.2" fill="none"/>
                      </g>
                    ))}
                  </g>
                )}
                {/* sparkle when settled */}
                {settleP > 0 && (
                  <g opacity={settleP}>
                    {[
                      {x: 730, y: 470}, {x: 870, y: 440}, {x: 1000, y: 460},
                      {x: 1140, y: 440}, {x: 1280, y: 470},
                    ].map((p, i) => {
                      const phase = ((time * 1.6) + i * 0.2) % 1;
                      const s = Math.sin(phase * Math.PI);
                      return (
                        <g key={i} transform={`translate(${p.x} ${p.y})`}
                           stroke={SketchColors.pencil} strokeWidth="1.4" strokeLinecap="round"
                           opacity={s * 0.9}>
                          <line x1="-9" y1="0" x2="9" y2="0"/>
                          <line x1="0" y1="-9" x2="0" y2="9"/>
                        </g>
                      );
                    })}
                  </g>
                )}
              </svg>
              <HandwrittenLabel text="① Légère préparation"
                x={140} y={400} size={40} progress={clamp(progress / 0.2, 0, 1)} rotate={-1}/>
              <HandwrittenLabel text="② Pose de fines lamelles céramique"
                x={140} y={470} size={30} progress={clamp((progress - 0.2) / 0.3, 0, 1)}
                color={SketchColors.pencilLight} rotate={-1}/>
              <HandwrittenLabel text="(0,3 à 0,5 mm d'épaisseur)"
                x={140} y={520} size={24} progress={clamp((progress - 0.4) / 0.3, 0, 1)}
                color={SketchColors.pencilLight} rotate={-1}/>
            </>
          );
        }}
      </Sprite>

      {/* Scene 3: smile after */}
      <Sprite start={9.5} end={14.0}>
        {({ progress }) => (
          <>
            <svg width="1920" height="1080" style={{ position: 'absolute', inset: 0 }}>
              <SketchDefs/>
              <g transform="translate(960 600)">
                {[-260, -130, 0, 130, 260].map((x, i) => (
                  <ToothIncisor key={i} cx={x} cy={0} scale={1.4}
                                drawProgress={1} washProgress={1} showGum={true}
                                whiteningProgress={1}
                                veneer={true} veneerProgress={1}/>
                ))}
              </g>
              {/* lips arc - simplified smile */}
              <g opacity={clamp(progress / 0.3, 0, 1)}>
                <path d="M 580 460 Q 500 580 580 760 L 1340 760 Q 1420 580 1340 460 Q 1340 480 1320 490 L 600 490 Q 580 480 580 460 Z"
                      fill="none" stroke={SketchColors.pencilLight}
                      strokeWidth="1.5" filter="url(#pencilRough)" opacity="0.5"/>
              </g>
            </svg>
            <HandwrittenLabel text="Un sourire harmonieux"
              x={140} y={400} size={42} progress={clamp(progress / 0.3, 0, 1)} rotate={-1}/>
            <HandwrittenLabel text="forme + teinte sur-mesure"
              x={140} y={460} size={28} progress={clamp((progress - 0.3) / 0.3, 0, 1)}
              color={SketchColors.pencilLight} rotate={-1}/>
          </>
        )}
      </Sprite>

      {/* Final */}
      <Sprite start={14.0} end={17.0}>
        {({ progress }) => (
          <div style={{ position: 'absolute', left: 0, right: 0, top: '40%', textAlign: 'center',
            opacity: progress < 0.2 ? progress * 5 : progress > 0.85 ? (1 - progress) * 6.6 : 1 }}>
            <div style={{ fontFamily: "'Caveat', cursive", fontSize: 92, fontWeight: 700, color: SketchColors.pencil, transform: 'rotate(-1deg)' }}>
              Le sourire que vous voulez.
            </div>
            <div style={{ fontFamily: "'Caveat', cursive", fontSize: 36, marginTop: 12, color: SketchColors.pencilLight, fontStyle: 'italic' }}>
              Naturel, durable, sur-mesure.
            </div>
          </div>
        )}
      </Sprite>

      <Signature progress={clamp((time - 14) / 1, 0, 1)}/>
    </PaperBg>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Stage width={1920} height={1080} duration={17} background="#f6efe2" persistKey="dent04">
    <FacetteAnim/>
  </Stage>
);
</script>
</body>
</html>
