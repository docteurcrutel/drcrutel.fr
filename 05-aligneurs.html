<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Dr. Crutel — N°5 Aligneurs</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; font-family: 'Caveat', cursive; overflow: hidden; }
  #root { position: absolute; inset: 0; }
  .nav-back { position: fixed; top: 16px; left: 16px; z-index: 100; font-family: 'Caveat', cursive; font-size: 22px; color: #f6efe2; text-decoration: none; background: rgba(20,20,20,0.7); padding: 6px 14px; border: 1px solid rgba(246,239,226,0.2); border-radius: 6px; }
</style>
<style id="embed-mode-style">
/* Embed mode: hide playback bar + nav, transparent letterbox bg */
body.embed-mode { background: transparent !important; }
body.embed-mode .nav-back { display: none !important; }
/* Stage's flex container is #root > div; PlaybackBar is its 2nd child */
body.embed-mode #root > div { background: transparent !important; }
body.embed-mode #root > div > *:nth-child(2) { display: none !important; }
/* Slight shadow tweak so it sits flat in iframe */
body.embed-mode #root > div > div:first-child > div { box-shadow: none !important; }
</style>
<script>
(function() {
  if (new URLSearchParams(location.search).has('embed')) {
    document.documentElement.classList.add('embed-mode');
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('embed-mode');
    });
  }
})();
</script>
</head>
<body data-anim-root data-screen-label="05 Aligneurs t=0s">
<a class="nav-back" href="index.html">← Carnet</a>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="sketch-components.jsx"></script>
<script type="text/babel">
const { useEffect } = React;

function AligneurAnim() {
  const time = useTime();
  useEffect(() => { document.body.setAttribute('data-screen-label', `05 Aligneurs t=${Math.floor(time)}s`); }, [Math.floor(time)]);

  // Tooth positions (5 teeth), at 4 stages of progressive alignment
  const stages = [
    // initial: messy
    [{x:-260,y:10,r:-8}, {x:-130,y:-12,r:6}, {x:0,y:15,r:-12}, {x:130,y:-8,r:10}, {x:260,y:10,r:-5}],
    // step 1
    [{x:-260,y:5,r:-5}, {x:-130,y:-6,r:3}, {x:0,y:8,r:-7}, {x:130,y:-4,r:6}, {x:260,y:5,r:-3}],
    // step 2
    [{x:-260,y:2,r:-2}, {x:-130,y:-2,r:1}, {x:0,y:3,r:-3}, {x:130,y:-2,r:2}, {x:260,y:2,r:-1}],
    // final: aligned
    [{x:-260,y:0,r:0}, {x:-130,y:0,r:0}, {x:0,y:0,r:0}, {x:130,y:0,r:0}, {x:260,y:0,r:0}],
  ];

  return (
    <PaperBg>
      <PageHeader title="Les aligneurs" subtitle="aligner les dents en discrétion" num={5} progress={1}/>

      {/* Scene 1: messy teeth + show alignment problem */}
      <Sprite start={0.5} end={4.0}>
        {({ progress }) => {
          const drawP = clamp(progress / 0.4, 0, 1);
          const washP = clamp((progress - 0.3) / 0.4, 0, 1);
          const s = stages[0];
          return (
            <>
              <svg width="1920" height="1080" style={{ position: 'absolute', inset: 0 }}>
                <SketchDefs/>
                <g transform="translate(960 600)">
                  {s.map((p, i) => (
                    <ToothIncisor key={i} cx={p.x} cy={p.y} scale={1.35} rotate={p.r}
                                  drawProgress={Math.max(0, drawP - i * 0.04)}
                                  washProgress={washP} showGum={true}/>
                  ))}
                </g>
              </svg>
              <HandwrittenLabel text="Dents mal alignées ?"
                x={140} y={400} size={42} progress={drawP} rotate={-1}/>
              <HandwrittenLabel text="(sans bagues métalliques !)"
                x={140} y={460} size={26} progress={clamp((progress - 0.3) / 0.4, 0, 1)}
                color={SketchColors.pencilLight} rotate={-1}/>
            </>
          );
        }}
      </Sprite>

      {/* Scene 2: progressive alignment */}
      <Sprite start={4.0} end={11.0}>
        {({ progress }) => {
          // 4 stages cycling
          const stageIdx = Math.min(3, Math.floor(progress * 4));
          const localT = (progress * 4) - stageIdx;
          const eased = Easing.easeInOutCubic(clamp(localT, 0, 1));
          const fromS = stages[stageIdx];
          const toS = stages[Math.min(3, stageIdx + 1)];

          // Aligner tray pulses
          const trayPhase = (progress * 4) % 1;
          const trayOpacity = trayPhase < 0.7 ? 1 : Math.max(0, 1 - (trayPhase - 0.7) * 5);
          const trayScale = 1 + (trayPhase < 0.1 ? trayPhase * 0.3 : 0);

          return (
            <>
              <svg width="1920" height="1080" style={{ position: 'absolute', inset: 0 }}>
                <SketchDefs/>
                <g transform="translate(960 600)">
                  {fromS.map((p, i) => {
                    const t = toS[i];
                    const x = p.x + (t.x - p.x) * eased;
                    const y = p.y + (t.y - p.y) * eased;
                    const r = p.r + (t.r - p.r) * eased;
                    return (
                      <ToothIncisor key={i} cx={x} cy={y} scale={1.35} rotate={r}
                                    drawProgress={1} washProgress={1} showGum={true}/>
                    );
                  })}
                  {/* aligner shell */}
                  <g opacity={trayOpacity * 0.85} style={{ transform: `scale(${trayScale})`, transformOrigin: '0 0' }}>
                    <path d="M -340 -180 Q 0 -200 340 -180 Q 360 -90 350 0 Q 360 30 340 50 Q 0 70 -340 50 Q -360 30 -350 0 Q -360 -90 -340 -180 Z"
                          fill="rgba(180, 210, 230, 0.18)"
                          stroke={SketchColors.pencil} strokeWidth="1.6" filter="url(#pencilRough)"/>
                    <path d="M -325 -175 Q 0 -192 325 -175"
                          stroke="rgba(255,255,255,0.7)" strokeWidth="2.5" fill="none"/>
                  </g>
                </g>
                {/* stage indicator */}
                <g transform="translate(140 420)">
                  {[0, 1, 2, 3].map(i => (
                    <g key={i} transform={`translate(${i * 90} 0)`}>
                      <circle cx="0" cy="0" r="22" fill={i <= stageIdx ? 'rgba(180, 210, 230, 0.5)' : 'rgba(0,0,0,0.05)'}
                              stroke={SketchColors.pencil} strokeWidth="1.4" filter="url(#pencilRough)"/>
                      <text x="0" y="8" textAnchor="middle"
                            style={{ font: "600 24px 'Caveat', cursive", fill: SketchColors.pencil }}>
                        {i + 1}
                      </text>
                      {i < 3 && (
                        <line x1="22" y1="0" x2="68" y2="0"
                              stroke={SketchColors.pencilLight} strokeWidth="1.2"
                              strokeDasharray="3 3"/>
                      )}
                    </g>
                  ))}
                </g>
              </svg>
              <HandwrittenLabel text="Une nouvelle gouttière toutes les 2 sem."
                x={140} y={500} size={28} progress={clamp(progress / 0.3, 0, 1)}
                color={SketchColors.pencilLight} rotate={-1}/>
              <HandwrittenLabel text="↳ les dents bougent en douceur"
                x={140} y={550} size={26} progress={clamp((progress - 0.3) / 0.3, 0, 1)}
                color={SketchColors.pencilLight} rotate={-1}/>
            </>
          );
        }}
      </Sprite>

      {/* Scene 3: aligned! */}
      <Sprite start={11.0} end={14.5}>
        {({ progress }) => (
          <>
            <svg width="1920" height="1080" style={{ position: 'absolute', inset: 0 }}>
              <SketchDefs/>
              <g transform="translate(960 600)">
                {stages[3].map((p, i) => (
                  <ToothIncisor key={i} cx={p.x} cy={p.y} scale={1.4}
                                drawProgress={1} washProgress={1} showGum={true}
                                whiteningProgress={0.3}/>
                ))}
              </g>
              {/* checkmark sketch */}
              <g transform="translate(960 380)" opacity={clamp(progress / 0.3, 0, 1)}>
                <circle cx="0" cy="0" r="48" fill="none"
                        stroke={SketchColors.pencil} strokeWidth="2" filter="url(#pencilRough)"/>
                <path d={`M -22 0 L -8 18 L 24 -18`}
                      stroke={SketchColors.pencil} strokeWidth="3.5" fill="none"
                      strokeLinecap="round" strokeLinejoin="round" filter="url(#pencilRough)"
                      style={{
                        strokeDasharray: 80,
                        strokeDashoffset: 80 - 80 * clamp(progress / 0.3, 0, 1),
                      }}/>
              </g>
            </svg>
            <HandwrittenLabel text="Dents alignées ✓"
              x={140} y={400} size={44} progress={clamp(progress / 0.3, 0, 1)} rotate={-1}/>
            <HandwrittenLabel text="6 à 18 mois selon les cas"
              x={140} y={460} size={26} progress={clamp((progress - 0.3) / 0.3, 0, 1)}
              color={SketchColors.pencilLight} rotate={-1}/>
          </>
        )}
      </Sprite>

      {/* Final */}
      <Sprite start={14.5} end={17.5}>
        {({ progress }) => (
          <div style={{ position: 'absolute', left: 0, right: 0, top: '40%', textAlign: 'center',
            opacity: progress < 0.2 ? progress * 5 : progress > 0.85 ? (1 - progress) * 6.6 : 1 }}>
            <div style={{ fontFamily: "'Caveat', cursive", fontSize: 92, fontWeight: 700, color: SketchColors.pencil, transform: 'rotate(-1deg)' }}>
              Invisible. Confortable.
            </div>
            <div style={{ fontFamily: "'Caveat', cursive", fontSize: 36, marginTop: 12, color: SketchColors.pencilLight, fontStyle: 'italic' }}>
              On les retire pour manger.
            </div>
          </div>
        )}
      </Sprite>

      <Signature progress={clamp((time - 14.5) / 1, 0, 1)}/>
    </PaperBg>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Stage width={1920} height={1080} duration={17.5} background="#f6efe2" persistKey="dent05">
    <AligneurAnim/>
  </Stage>
);
</script>
</body>
</html>
